r%3D%225.200%22%20fill%3D%22%231D2340%22%2F%3E%0A%20%20%20%20%20%20%3Ccircle%20cx%3D%2243.800%22%20cy%3D%2252.200%22%20r%3D%221.800%22%20fill%3D%22%23fff%22%2F%3E%3Ccircle%20cx%3D%2279.800%22%20cy%3D%2252.200%22%20r%3D%221.800%22%20fill%3D%22%23fff%22%2F%3E%0A%20%20%20%20%3Cpath%20d%3D%22M51%2082q9%208%2018%200%22%20stroke%3D%22%235B3A22%22%20stroke-width%3D%223.2%22%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<style>
/* =====================================================================
   VISUAL (parte 1): cores, texto, botões, cartões, código, avisos
   Identidade própria: papel quente, tinta azul-marinho, verde-azulado e âmbar.
   Contornos escuros e sombra "dura" nos botões. Mascote: Capi, a capivara.
   ===================================================================== */
:root{
  --bg:#FBF8F2; --card:#FFFFFF; --ink:#1B2140; --muted:#4A5170; --line:#E3DDD0; --suave:#F2EDE2;
  --primary:#0F766E; --primary-ink:#FFFFFF; --primary-bg:#D9F2EE;
  --accent:#F5A524; --accent-bg:#FFF0D1; --accent-ink:#5B3A00;
  --ok:#15803D; --ok-bg:#DCFCE7; --ok-ink:#14532D;
  --bad:#B42318; --bad-bg:#FEE4E2; --bad-ink:#7A271A;
  --code-bg:#161B33; --code-ink:#E8ECFF; --code-dim:#A3ACCE;
  --tok-kw:#FF9AC1; --tok-str:#9AE6B4; --tok-num:#FFD479; --tok-fn:#8FD3FF; --tok-com:#A3ACCE;
  --raio:16px; --contorno:2px solid var(--ink);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--sans);
  background-image:radial-gradient(#E6DFCF 1.2px,transparent 1.2px);background-size:22px 22px;
  padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{line-height:1.2;margin:0;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}
h2{font-size:1.25rem;font-weight:800}
p{margin:0}
code{font-family:var(--mono);font-size:.92em;background:var(--suave);border:1px solid var(--line);border-radius:6px;padding:.05em .35em;white-space:pre-wrap}
strong{font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid #2563EB;outline-offset:3px;border-radius:8px}
#principal:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;border:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.pular{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;transition:top .15s}
.pular:focus{top:12px}
.ic{width:1.35em;height:1.35em;flex:none;vertical-align:-.25em}
.capi{flex:none;display:block}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:12px 22px;
  border:var(--contorno);border-radius:14px;background:var(--card);color:var(--ink);font-weight:800;font-size:1.05rem;
  box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;text-align:center;line-height:1.2}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 var(--ink)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{background:#E9E4D8;color:#5C6280;border-color:#8E93A8;box-shadow:0 4px 0 #8E93A8;cursor:not-allowed}
.btn-primario{background:var(--primary);color:var(--primary-ink)}
.btn-ok{background:var(--ok);color:#fff}
.btn-ruim{background:var(--bad);color:#fff}
.btn-cheio{width:100%}
.btn-link{background:none;border:0;box-shadow:none;min-height:44px;padding:8px 10px;font-weight:700;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.btn-link:hover:not(:disabled){transform:none;box-shadow:none;color:var(--ink)}
.btn-link:active:not(:disabled){transform:none;box-shadow:none}
.btn-icone{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border:0;background:transparent;border-radius:12px;color:var(--muted)}
.btn-icone:hover{background:var(--suave);color:var(--ink)}
.btn-icone .ic{width:1.6em;height:1.6em}

/* ---------- cartões e blocos ---------- */
.cartao{background:var(--card);border:var(--contorno);border-radius:18px;box-shadow:0 4px 0 var(--ink);padding:18px}
.etiqueta{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip-stat{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border:var(--contorno);border-radius:999px;background:var(--card);font-weight:800;font-variant-numeric:tabular-nums}
.chip-stat .ic{width:1.3em;height:1.3em}
.chip-stat.chama .ic{color:#E8590C}.chip-stat.chama.apagada .ic{color:#8E93A8}
.chip-stat.xp .ic{color:#D98E00}
.chip-stat.vidas .ic{color:#D92D20}
.chip-stat.vidas.pouca{background:var(--bad-bg);color:var(--bad-ink)}

/* ---------- código ---------- */
.cod{margin:0;padding:12px 0;background:var(--code-bg);color:var(--code-ink);border-radius:14px;font-family:var(--mono);font-size:.95rem;line-height:1.55;border:var(--contorno);overflow:hidden}
.cod .l{display:flex;gap:12px;padding:1px 14px;min-height:1.55em;align-items:baseline}
.cod .n{flex:none;width:1.4em;text-align:right;color:var(--code-dim);user-select:none;font-variant-numeric:tabular-nums}
.cod code,.cod .t{background:none;border:0;padding:0;font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1}
.k{color:var(--tok-kw)}.s{color:var(--tok-str)}.d{color:var(--tok-num)}.f{color:var(--tok-fn)}.c{color:var(--tok-com);font-style:italic}
.saida{margin:0;padding:10px 14px;background:#0B0F22;color:#D6FFE6;border-radius:12px;font-family:var(--mono);font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;border:2px solid #0B0F22}
.saida-rotulo{display:block;margin:10px 0 4px;font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* ---------- aviso de armazenamento, modal, toast ---------- */
.aviso{display:flex;gap:10px;align-items:flex-start;margin:12px 0;padding:12px 14px;background:var(--accent-bg);border:2px solid #9A6700;border-radius:14px;color:var(--accent-ink);font-weight:600;font-size:.95rem}
.aviso .ic{color:#9A6700;margin-top:2px}
.fundo-modal{position:fixed;inset:0;z-index:50;background:rgba(27,33,64,.6);display:flex;align-items:flex-end;justify-content:center;padding:0;animation:aparecer .15s ease-out}
.modal{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--card);border:var(--contorno);border-bottom:0;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:subir .22s ease-out}
.modal h2{margin-bottom:10px}
.modal .corpo-modal{display:grid;gap:12px;margin-bottom:18px}
.modal .acoes-modal{display:grid;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);pointer-events:none}
.toast .bolha{background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:.95rem;text-align:center;animation:subir .2s ease-out}
@media (min-width:640px){.fundo-modal{align-items:center;padding:20px}.modal{border-bottom:var(--contorno);border-radius:22px;box-shadow:0 6px 0 var(--ink)}}

/* ---------- animações leves (desligam se a pessoa pediu menos movimento) ---------- */
@keyframes aparecer{from{opacity:0}to{opacity:1}}
@keyframes subir{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulo{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes tremer{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes flutuar{0%{opacity:0;transform:translateY(8px) scale(.9)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}
@keyframes balanco{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes pulso-no{0%,100%{box-shadow:0 5px 0 var(--ink),0 0 0 0 rgba(245,165,36,.55)}50%{box-shadow:0 5px 0 var(--ink),0 0 0 12px rgba(245,165,36,0)}}
@keyframes confete{0%{opacity:1;transform:translate(0,-10px) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}}
.anim-pulo{animation:pulo .35s ease-out}
.anim-tremer{animation:tremer .4s ease-out}
.anim-balanco{animation:balanco .6s ease-in-out}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}

/* =====================================================================
   VISUAL (parte 2): telas — trilha, início da lição, lição, feedback, fim
   ===================================================================== */
#app{max-width:640px;margin:0 auto;padding:0 16px 40px}

/* ---------- link de volta ao site que hospeda o jogo (DEV EASY) ---------- */
.voltar-site{padding-top:6px}
.voltar-site a{display:inline-flex;align-items:center;min-height:44px;padding-right:12px;font-weight:700;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.voltar-site a:hover{color:var(--ink)}
.voltar-site+.topo{padding-top:0}

/* ---------- trilha (tela inicial) ---------- */
.topo{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 6px}
.marca{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;margin:0}
.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero{display:flex;align-items:center;gap:14px;margin:14px 0 8px}
.balao{position:relative;flex:1;background:var(--card);border:var(--contorno);border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 var(--ink);font-weight:600}
.balao::before{content:"";position:absolute;left:-10px;top:50%;width:16px;height:16px;margin-top:-8px;background:var(--card);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.balao small{display:block;margin-top:2px;color:var(--muted);font-weight:600;font-size:.9rem}
.unidade{margin:22px 0 4px;display:grid;gap:4px}
.unidade h2{font-size:1.2rem}
.unidade p{color:var(--muted);font-size:.95rem}
.trilha{list-style:none;margin:0;padding:14px 0 22px;position:relative;display:grid;gap:24px;justify-items:center}
.trilha::before{content:"";position:absolute;top:40px;bottom:60px;left:50%;border-left:4px dotted #CFC7B3;transform:translateX(-2px)}
.trilha li{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;transform:translateX(calc(var(--d,0) * 46px))}
.no{width:88px;height:88px;border-radius:50%;border:var(--contorno);display:grid;place-items:center;padding:0;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.no .ic{width:2.4rem;height:2.4rem}
.no:hover{transform:translateY(-2px)}
.no:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.no.disponivel{background:var(--accent);color:var(--ink)}
.no.atual{animation:pulso-no 2.2s ease-in-out infinite}
.no.concluida{background:var(--primary);color:#fff}
.no.bloqueada{background:#E9E4D8;color:#5C6280;border-color:#8E93A8;box-shadow:0 5px 0 #8E93A8}
.rotulo-no{display:grid;gap:0;background:var(--bg);padding:2px 8px;border-radius:10px}
.rotulo-no b{font-size:1rem}
.rotulo-no span{font-size:.88rem;color:var(--muted);font-weight:600}
.selo{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:800;color:var(--ok-ink);background:var(--ok-bg);border:2px solid var(--ok);border-radius:999px;padding:0 8px}
.selo .ic{width:1em;height:1em}
.sec-titulo{margin:18px 0 10px}
.conquistas{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.conq{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;padding:12px 14px;background:var(--card);border:var(--contorno);border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.conq .medalha{grid-row:span 2;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--accent);border:var(--contorno);color:var(--ink)}
.conq .medalha .ic{width:1.6rem;height:1.6rem}
.conq.trancada{background:var(--suave);box-shadow:0 3px 0 #8E93A8;border-color:#8E93A8}
.conq.trancada .medalha{background:#E9E4D8;border-color:#8E93A8;color:#5C6280}
.conq b{font-size:1rem;line-height:1.2}
.conq span{font-size:.88rem;color:var(--muted);font-weight:600;line-height:1.3}
.conq .estado{grid-column:2;font-size:.8rem;font-weight:800;color:var(--ok-ink)}
.conq.trancada .estado{color:#5C6280}
.rodape{margin-top:26px;padding-top:14px;border-top:2px dashed #CFC7B3;display:grid;gap:6px;justify-items:center;text-align:center;color:var(--muted);font-size:.9rem}

/* ---------- início da lição (resumo) ---------- */
.inicio{display:grid;gap:16px;padding-top:14px}
.inicio .topo-inicio{display:flex;align-items:center;gap:6px}
.inicio h1{font-size:1.6rem}
.conceito{display:grid;gap:10px}
.conceito p,.conceito li{font-size:1.02rem}
.conceito ul{margin:0;padding-left:1.2em;display:grid;gap:6px}
.acoes-inicio{display:grid;gap:10px;margin-top:4px}

/* ---------- lição ---------- */
.licao{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.barra{display:flex;align-items:center;gap:8px;padding:12px 0}
.prog{flex:1;height:20px;border:var(--contorno);border-radius:999px;background:var(--card);overflow:hidden}
.prog-i{height:100%;background:var(--primary);border-radius:0 999px 999px 0;transition:width .4s ease;min-width:0}
.corpo{flex:1;display:grid;align-content:start;gap:16px;padding:10px 0 28px}
.corpo h1{font-size:1.4rem;outline:none}
.corpo h1:focus{outline:none}
.tipo{display:flex;align-items:center;gap:8px}
.tipo .etiqueta{background:var(--card);border:2px solid var(--ink);border-radius:999px;padding:2px 10px;color:var(--ink)}
.rodape-acao{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:2px solid var(--ink)}
.rodape-acao.ok{background:var(--ok-bg);border-top-color:var(--ok)}
.rodape-acao.ruim{background:var(--bad-bg);border-top-color:var(--bad)}
.fb{display:grid;gap:12px;animation:subir .22s ease-out}
.fb-corpo{display:grid;gap:10px;max-height:52vh;max-height:52dvh;overflow:auto;overscroll-behavior:contain}
@media (max-height:520px){.fb-corpo{max-height:30vh;max-height:30dvh}.fb-cab .capi{width:40px;height:40px}}
.fb-cab{display:flex;align-items:center;gap:12px}
.fb-tit{display:block;font-size:1.3rem;font-weight:800;line-height:1.15}
.ok .fb-tit{color:var(--ok-ink)}.ruim .fb-tit{color:var(--bad-ink)}
.fb-xp{position:relative;display:inline-block;margin-top:2px;font-weight:800;color:var(--ok-ink);font-size:.95rem}
.fb-xp::after{content:attr(data-flutua);position:absolute;left:0;top:-4px;font-weight:800;color:#D98E00;animation:flutuar 1.1s ease-out forwards;pointer-events:none}
.fb-txt{font-size:1rem;color:var(--ink)}
.ok .fb-txt{color:var(--ok-ink)}.ruim .fb-txt{color:var(--bad-ink)}
.fb-extra{display:grid;gap:6px;padding:10px 12px;background:rgba(255,255,255,.7);border:2px solid currentColor;border-radius:12px;font-size:.95rem}
.ruim .fb-extra{color:var(--bad-ink)}.ok .fb-extra{color:var(--ok-ink)}
.fb-extra .etiqueta{color:inherit}
.fb-extra .cod{font-size:.9rem;border-width:2px}
.fb-volta{font-size:.9rem;font-weight:700;color:var(--bad-ink)}

/* ---------- fim da lição ---------- */
.fim{display:grid;gap:16px;justify-items:center;text-align:center;padding-top:30px;position:relative}
.fim .capi{animation:balanco .9s ease-in-out 2}
.fim h1{font-size:1.8rem}
.fim .sub{color:var(--muted);font-weight:600}
.fim .aviso{width:100%;margin:0;text-align:left}
.resultados{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.res{display:grid;gap:2px;justify-items:center;padding:12px 6px;background:var(--card);border:var(--contorno);border-radius:16px;box-shadow:0 3px 0 var(--ink)}
.res b{font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.res span{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.res .ic{width:1.5rem;height:1.5rem}
.res.xp .ic{color:#D98E00}.res.prec .ic{color:var(--primary)}.res.vid .ic{color:#D92D20}
.novas{display:grid;gap:8px;width:100%}
.nova{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 12px;background:var(--accent-bg);border:2px solid #9A6700;border-radius:14px}
.nova .medalha{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent);border:var(--contorno)}
.nova small{display:block;color:var(--accent-ink);font-weight:600}
.fim .acoes-fim{display:grid;gap:10px;width:100%;margin-top:6px}
.confete{position:absolute;left:0;right:0;top:20px;height:0;pointer-events:none;overflow:visible}
.confete i{position:absolute;left:50%;top:0;width:9px;height:14px;border-radius:2px;animation:confete 1.6s ease-out forwards}

@media (min-width:640px){
  body{font-size:18px}
  .no{width:96px;height:96px}
  .trilha li{transform:translateX(calc(var(--d,0) * 60px))}
}

/* =====================================================================
   VISUAL (parte 3): os 5 jogos
   ===================================================================== */
.jogo{display:grid;gap:14px}
.instr{color:var(--muted);font-weight:600;font-size:.98rem}
.cod .l{margin:0 6px;padding:2px 8px;border-radius:8px}

/* ---------- 1. Quiz e opções de correção ---------- */
.opcoes{display:grid;gap:10px}
.opt{position:relative;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;background:var(--card);border:var(--contorno);border-radius:14px;box-shadow:0 3px 0 var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s,background .12s}
.opt:hover{transform:translateY(-1px)}
.opt:focus-within{outline:3px solid #2563EB;outline-offset:3px}
.opt .tecla{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--suave)}
.opt .txt{flex:1;min-width:0;font-family:var(--mono);font-size:1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.opt .res{flex:none;display:none;width:28px;height:28px;border-radius:50%;place-items:center;color:#fff}
.opt .res .ic{width:1.1rem;height:1.1rem}
.opt.sel{background:var(--primary-bg);border-color:var(--primary);box-shadow:0 3px 0 var(--primary)}
.opt.sel .tecla{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.certa{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok);animation:pulo .35s ease-out}
.opt.certa .res{display:grid;background:var(--ok)}
.opt.errada{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:tremer .4s ease-out}
.opt.errada .res{display:grid;background:var(--bad)}
.opt.travada{cursor:default}
.opt.travada:hover{transform:none}

/* ---------- 2. Caça ao Bug ---------- */
.cod label.l{cursor:pointer;transition:background .12s;min-height:44px;padding-block:8px;align-items:center}
.cod label.l:hover{background:rgba(255,255,255,.1)}
.cod label.l:focus-within{outline:3px solid #7DB2FF;outline-offset:0}
.cod label.l.sel{background:rgba(245,165,36,.28);box-shadow:inset 0 0 0 2px var(--accent)}
.cod .l.bug{background:rgba(255,128,128,.24);box-shadow:inset 0 0 0 2px #FF9C94}
.cod .l.bug-errou{background:rgba(255,128,128,.24);box-shadow:inset 0 0 0 2px #FF9C94;animation:tremer .4s ease-out}
.cod .l.bug-certo{background:rgba(154,230,180,.22);box-shadow:inset 0 0 0 2px #7FD9A0}
.cod .l .marca{flex:none;margin-left:auto;align-self:center;font-family:var(--sans);font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:#FF9C94;color:#4A0D08;white-space:nowrap}
.cod .l .marca.boa{background:#7FD9A0;color:#0A3B1C}
.etapa-fix{display:grid;gap:10px;animation:subir .2s ease-out}
.etapa-fix .pergunta{font-weight:800}

/* ---------- 3. Monte o Código ---------- */
.slots{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.slot{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:6px 12px;border:2px dashed #7B819B;border-radius:12px;background:rgba(255,255,255,.65);text-align:left;font-family:var(--mono);font-size:.95rem;color:var(--muted)}
.slot .n{flex:none;width:1.4em;text-align:right;font-weight:700;color:var(--muted)}
.slot .t{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.slot.cheio{border:var(--contorno);background:var(--code-bg);color:var(--code-ink);box-shadow:0 3px 0 var(--ink)}
.slot.cheio .n{color:var(--code-dim)}
.slot.alvo{border-color:#9A6700;background:var(--accent-bg);color:var(--accent-ink)}
.slot.alvo .n{color:var(--accent-ink)}
.slot.certo{box-shadow:inset 0 0 0 3px #7FD9A0,0 3px 0 var(--ok)}
.slot.errado{box-shadow:inset 0 0 0 3px #FF9C94,0 3px 0 var(--bad);animation:tremer .4s ease-out}
.slot:disabled{cursor:default}
.banco{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:10px;border-radius:14px;background:var(--suave);border:2px solid var(--line);align-content:flex-start}
.banco:empty::after{content:"Todas as linhas já foram usadas.";color:var(--muted);font-size:.9rem;font-weight:600;align-self:center}
.chip{min-height:46px;min-width:48px;max-width:100%;padding:8px 12px;border:var(--contorno);border-radius:12px;background:var(--code-bg);color:var(--code-ink);font-family:var(--mono);font-size:.95rem;box-shadow:0 3px 0 var(--ink);text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;transition:transform .08s,box-shadow .08s}
.chip:hover:not(:disabled){transform:translateY(-1px)}
.chip:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chip:disabled{opacity:.55;cursor:default}

/* ---------- 4. Complete a Lacuna ---------- */
.buraco{display:inline-flex;align-items:center;justify-content:center;min-width:3.6em;min-height:44px;padding:0 10px;margin:2px 3px;border:2px dashed var(--code-dim);border-radius:8px;background:rgba(255,255,255,.08);color:var(--code-ink);font:inherit;vertical-align:middle;white-space:pre}
.buraco:hover:not(:disabled){background:rgba(255,255,255,.18)}
.buraco.cheio{border-style:solid;border-color:var(--accent);background:rgba(245,165,36,.22)}
.buraco.alvo{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.buraco.certo{border-style:solid;border-color:#7FD9A0;background:rgba(127,217,160,.24)}
.buraco.errado{border-style:solid;border-color:#FF9C94;background:rgba(255,156,148,.24);animation:tremer .4s ease-out}
.buraco:disabled{cursor:default;color:var(--code-ink)}

/* ---------- 5. Ligue os Pares ---------- */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-items:start}
.pares .col{display:grid;gap:10px;align-content:start}
.par{display:flex;align-items:center;justify-content:center;min-height:60px;width:100%;padding:8px 10px;border:var(--contorno);border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--ink);font-weight:700;font-size:.98rem;text-align:center;overflow-wrap:anywhere;line-height:1.25;transition:transform .08s,box-shadow .08s,background .12s}
.par.mono{font-family:var(--mono);font-weight:600;font-size:.92rem}
.par:hover:not(:disabled){transform:translateY(-1px)}
.par[aria-pressed="true"]{background:var(--accent-bg);border-color:#9A6700;box-shadow:0 3px 0 #9A6700}
.par.casado{background:var(--c,#CFF3EE);color:var(--ink);opacity:1;cursor:default;transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.par.casado::before{content:"";flex:none;width:12px;height:12px;margin-right:8px;border-radius:50%;background:var(--ink)}
.par.erro{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 3px 0 var(--bad);animation:tremer .4s ease-out}
.par:disabled{color:var(--ink);opacity:1}
.dica-pares{min-height:1.5em;font-weight:700;font-size:.95rem;color:var(--muted)}
.dica-pares.ruim{color:var(--bad-ink)}

.lista-pares{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:.92rem}

</style>
</head>

<script>
/* Rede de segurança: se o JavaScript principal quebrar (ex.: vírgula faltando numa lição editada), mostra um aviso em vez de página em branco. */
window.addEventListener('error', function (e) {
  var app = document.getElementById('app');
  if (!app || app.firstChild) return;
  var caixa = document.createElement('main');
  caixa.style.cssText = 'max-width:640px;margin:0 auto;padding:24px 16px;font:17px/1.5 system-ui,sans-serif;color:#1B2140';
  var h = document.createElement('h1');
  h.style.cssText = 'font-size:1.4rem;margin:0 0 12px';
  h.textContent = 'O site não conseguiu abrir';
  var p = document.createElement('p');
  p.textContent = 'Isso costuma acontecer quando uma lição editada tem erro de digitação (vírgula, aspas ou chave faltando). ' +
    'Mensagem do navegador: ' + (e.message || 'erro desconhecido') + (e.lineno ? ' (perto da linha ' + e.lineno + ' do arquivo)' : '') + '. ' +
    'Desfaça a última edição ou volte para a versão que funcionava.';
  caixa.appendChild(h); caixa.appendChild(p); app.appendChild(caixa);
});
</script>

/* =====================================================================
   1. CONTEÚDO  —  é AQUI que você adiciona e edita lições (o motor fica mais abaixo)
   =====================================================================

   COMO ADICIONAR UMA LIÇÃO
   1) Copie um bloco de lição inteiro (de "{ id:" até o "}," que fecha) e cole acima da
      linha "COLE A PRÓXIMA LIÇÃO AQUI". Todo bloco termina com "}," (chave e vírgula).

   3) Cada exercício tem um "tipo": "quiz", "bug", "monte", "lacuna" ou "pares".
      A Lição 1 tem um exemplo de cada tipo.
   4) quiz e bug: a PRIMEIRA opção é a certa (o motor embaralha na tela).
   5) monte: escreva as linhas na ordem CERTA (o motor embaralha na tela).
   6) lacuna: marque cada buraco com {1}, {2}... e liste as palavras certas, na ordem, em "respostas".
   7) pares: cada par é [esquerda, direita]. O motor embaralha a coluna da direita.
   8) Regra de ouro: cada exercício precisa ter UMA única resposta certa.
   Nesta versão o código do aluno não é executado: as respostas são conferidas contra
   as que estão escritas aqui. Por isso, confira cada exercício com cuidado.
   ===================================================================== */

};

            {

/* =====================================================================
   1b. CONFERÊNCIA DAS LIÇÕES  (rede de segurança para quem edita o conteúdo)
   Ao abrir o site, confere se cada lição está completa e sem erro óbvio de digitação.
   Se achar problema, mostra a lista na tela em vez de deixar a página quebrada.
   Importante: isto NÃO executa Python nem prova que a resposta certa está certa.
   Quem garante isso é você (ou o script tools/verificar.py, se você tiver Python).
   ===================================================================== */
function validarCurso() {
  const erros = [];
  const texto = function (x) { return typeof x === 'string' && x.trim() !== ''; };
  const lista = Array.isArray;
  const faltaTexto = function (obj, campos) { return campos.filter(function (c) { return !texto(obj[c]); }); };

  function exercicio(ex, rot) {
    if (!ex || typeof ex !== 'object') { erros.push(rot + ': o exercício está vazio ou mal escrito.'); return; }
    if (!JOGOS[ex.tipo]) { erros.push(rot + ': "tipo" precisa ser quiz, bug, monte, lacuna ou pares (veio ' + JSON.stringify(ex.tipo) + ').'); return; }
    faltaTexto(ex, ['enunciado', 'explicacao']).forEach(function (c) { erros.push(rot + ': falta "' + c + '".'); });
    if (ex.entrada !== undefined && !(lista(ex.entrada) && ex.entrada.every(texto))) erros.push(rot + ': "entrada" precisa ser uma lista de textos.');

    if (ex.tipo === 'quiz') {
      if (!lista(ex.opcoes) || ex.opcoes.length < 2 || ex.opcoes.length > 6 || !ex.opcoes.every(texto)) erros.push(rot + ': "opcoes" precisa ser uma lista de 2 a 6 textos (a primeira é a certa).');
      else if (new Set(ex.opcoes).size !== ex.opcoes.length) erros.push(rot + ': há opções repetidas em "opcoes".');
    }
    if (ex.tipo === 'bug') {
      if (!lista(ex.linhas) || ex.linhas.length < 2 || !ex.linhas.every(function (l) { return typeof l === 'string'; })) { erros.push(rot + ': "linhas" precisa ser uma lista com pelo menos 2 textos.'); return; }
      if (!Number.isInteger(ex.linhaErrada) || ex.linhaErrada < 1 || ex.linhaErrada > ex.linhas.length) erros.push(rot + ': "linhaErrada" precisa ser um número de 1 a ' + ex.linhas.length + '.');
      if (!lista(ex.opcoes) || ex.opcoes.length !== 3 || !ex.opcoes.every(texto)) erros.push(rot + ': "opcoes" precisa ter exatamente 3 textos (a primeira é a correção certa).');
      else {
        if (new Set(ex.opcoes).size !== 3) erros.push(rot + ': há opções repetidas em "opcoes".');
        if (ex.opcoes[0] === ex.linhas[ex.linhaErrada - 1]) erros.push(rot + ': a correção certa (primeira opção) é igual à linha com erro.');
      }
      if (!texto(ex.porque)) erros.push(rot + ': falta "porque" (por que o erro acontece).');
    }
    if (ex.tipo === 'monte') {
      if (!lista(ex.linhas) || ex.linhas.length < 2 || !ex.linhas.every(texto)) erros.push(rot + ': "linhas" precisa ser uma lista com pelo menos 2 textos, na ordem CERTA.');
    }
    if (ex.tipo === 'lacuna') {
      if (!texto(ex.codigo)) { erros.push(rot + ': falta "codigo".'); return; }
      if (!lista(ex.respostas) || !ex.respostas.length || !ex.respostas.every(texto)) { erros.push(rot + ': "respostas" precisa ser uma lista de textos, na ordem dos buracos.'); return; }
      if (!lista(ex.banco) || !ex.banco.every(texto)) { erros.push(rot + ': "banco" precisa ser uma lista de textos.'); return; }
      const sobra = ex.banco.slice();
      ex.respostas.forEach(function (r) {
        const i = sobra.indexOf(r);
        if (i < 0) erros.push(rot + ': a resposta ' + JSON.stringify(r) + ' não está no "banco" (ou foi usada mais vezes do que aparece lá).'); else sobra.splice(i, 1);
      });
      for (let n = 1; n <= ex.respostas.length; n++) if (ex.codigo.indexOf('{' + n + '}') < 0) erros.push(rot + ': falta o buraco {' + n + '} no "codigo".');
      if (ex.codigo.indexOf('{' + (ex.respostas.length + 1) + '}') >= 0) erros.push(rot + ': há buraco a mais no "codigo" (só há ' + ex.respostas.length + ' respostas).');
    }
    if (ex.tipo === 'pares') {
      const ok = lista(ex.pares) && ex.pares.length >= 2 && ex.pares.every(function (p) { return lista(p) && p.length === 2 && texto(p[0]) && texto(p[1]); });
      if (!ok) { erros.push(rot + ': "pares" precisa ser uma lista de pelo menos 2 pares [esquerda, direita].'); return; }
      if (new Set(ex.pares.map(function (p) { return p[0]; })).size !== ex.pares.length) erros.push(rot + ': há itens repetidos na coluna da esquerda.');
      if (new Set(ex.pares.map(function (p) { return p[1]; })).size !== ex.pares.length) erros.push(rot + ': há itens repetidos na coluna da direita (o par ficaria ambíguo).');
    }
  }

  try {
    if (APP.voltar !== null && APP.voltar !== undefined && !(typeof APP.voltar === 'object' && texto(APP.voltar.texto) && texto(APP.voltar.href))) erros.push('"APP.voltar" precisa ser null ou { texto: "...", href: "..." }.');
    if (!lista(CURSO.unidades) || !CURSO.unidades.length) return erros.concat(['"CURSO.unidades" precisa ser uma lista com pelo menos uma unidade.']);
    const vistos = {};
    CURSO.unidades.forEach(function (u, i) {
      const un = 'Unidade ' + (i + 1);
      if (!u || !texto(u.id) || !texto(u.titulo)) { erros.push(un + ': falta "id" ou "titulo".'); return; }
      if (!lista(u.licoes) || !u.licoes.length) { erros.push(un + ': "licoes" precisa ser uma lista com pelo menos uma lição.'); return; }
      u.licoes.forEach(function (l, j) {
        if (!l || !texto(l.id)) { erros.push(un + ', lição ' + (j + 1) + ': falta o "id".'); return; }
        const ln = 'Lição ' + l.id;
        if (vistos[l.id]) erros.push(ln + ': o "id" está repetido (cada lição precisa de um id diferente).');
        vistos[l.id] = true;
        faltaTexto(l, ['titulo', 'resumo']).forEach(function (c) { erros.push(ln + ': falta "' + c + '".'); });
        const it = l.intro;
        if (!it || !lista(it.paragrafos) || !it.paragrafos.length || !it.paragrafos.every(texto)) erros.push(ln + ': falta "intro.paragrafos" (lista de textos).');
        if (!it || !it.exemplo || !texto(it.exemplo.codigo) || !texto(it.exemplo.saida)) erros.push(ln + ': falta "intro.exemplo" com "codigo" e "saida".');
        if (!lista(l.exercicios) || !l.exercicios.length) { erros.push(ln + ': falta a lista "exercicios".'); return; }
        l.exercicios.forEach(function (ex, k) { exercicio(ex, ln + ', exercício ' + (k + 1)); });
      });
    });
    if (!lista(CONQUISTAS)) erros.push('"CONQUISTAS" precisa ser uma lista.');
    else CONQUISTAS.forEach(function (c) {
      if (!c || !texto(c.id) || !texto(c.titulo) || !c.regra || ['licoes', 'semErros', 'sequencia'].indexOf(c.regra.tipo) < 0) erros.push('Conquista ' + JSON.stringify(c && c.id) + ': falta "id", "titulo" ou "regra" válida.');
    });
  } catch (e) {
    erros.push('Não consegui conferir as lições (' + e.message + ').');
  }
  return erros;
}

  const h = document.createElement('h1');
  h.style.cssText = 'font-size:1.4rem;margin:0 0 12px';

const $ = (sel, raiz) => (raiz || document).querySelector(sel);
const $$ = (sel, raiz) => Array.from((raiz || document).querySelectorAll(sel));

/* Escapa texto para colocar dentro de HTML com segurança. */
function esc(t) {
  return String(t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Texto simples dos exercícios: `código` vira <code> e **negrito** vira <strong>.
   Primeiro escapa o HTML, então é seguro mesmo que o texto tenha < ou &. */
function fmt(t) {
  return esc(t).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

function sortear(lista) {
  return lista[Math.floor(Math.random() * lista.length)];
}

/* Embaralha (Fisher-Yates). "proibida" (opcional) recebe a lista embaralhada e responde
   true se ela não serve (ex.: ficou igual à ordem certa); aí embaralha de novo. */
function embaralhar(lista, proibida) {
  let r, tentativas = 0;
  do {
    r = lista.slice();
    for (let i = r.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = r[i]; r[i] = r[j]; r[j] = tmp;
    }
    tentativas++;
  } while (proibida && proibida(r) && tentativas < 40);
  return r;
}

/* Datas: sempre no horário LOCAL do aparelho, no formato "AAAA-MM-DD". */
function hoje() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* Quantos dias de "a" até "b" (positivo se b é depois de a). Usa UTC só para a conta, então horário de verão não atrapalha. */
function diasEntre(a, b) {
  const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
  return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 864e5);
}

/* Ícones e mascote (desenhados em SVG dentro do index.html, nada vem da internet). */
function icone(nome) {
  return '<svg class="ic" aria-hidden="true" focusable="false"><use href="#i-' + nome + '"/></svg>';
}
function capi(humor, tamanho) {
  const t = tamanho || 96;
  return '<svg class="capi" width="' + t + '" height="' + t + '" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><use href="#capi-' + humor + '"/></svg>';
}

/* ---------- colorir código Python (só enfeite: nada aqui executa código) ---------- */
const PALAVRAS_PY = /^(?:True|False|None|and|or|not|if|elif|else|for|while|in|def|return|import|from|as|is)$/;
const NATIVAS_PY = /^(?:print|input|int|float|str|bool|type|len|range)$/;
function colorir(linha) {
  const re = /(#.*$)|("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z_0-9]*)/g;
  let saida = '', ultimo = 0, m;
  while ((m = re.exec(linha)) !== null) {
    saida += esc(linha.slice(ultimo, m.index));
    const tok = m[0];
    if (m[1]) saida += '<span class="c">' + esc(tok) + '</span>';
    else if (m[2]) saida += '<span class="s">' + esc(tok) + '</span>';
    else if (m[3]) saida += '<span class="d">' + esc(tok) + '</span>';
    else if (PALAVRAS_PY.test(tok)) saida += '<span class="k">' + esc(tok) + '</span>';
    else if (NATIVAS_PY.test(tok) && linha.charAt(m.index + tok.length) === '(') saida += '<span class="f">' + esc(tok) + '</span>';
    else saida += esc(tok);
    ultimo = m.index + tok.length;
  }
  return saida + esc(linha.slice(ultimo));
}

/* Bloco de código com números de linha. */
function blocoCodigo(codigo, rotulo) {
  const linhas = String(codigo).split('\n');
  return '<div class="cod" role="group" aria-label="' + esc(rotulo || 'Código') + '">' +
    linhas.map((l, i) => '<div class="l"><span class="n" aria-hidden="true">' + (i + 1) + '</span><code>' + (colorir(l) || ' ') + '</code></div>').join('') +
    '</div>';
}
/* Caixa preta com o que o programa mostra na tela. */
function blocoSaida(texto) {
  return '<pre class="saida">' + esc(texto) + '</pre>';
}

/* =====================================================================
   3. PROGRESSO: armazenamento seguro + regras de XP, sequência e conquistas
   ===================================================================== */
const CHAVE = 'codivara:progresso:v1';

/* Guarda no localStorage DENTRO de try/catch. Se o navegador bloquear (modo privado
   restrito, cookies desligados, disco cheio), o site continua funcionando só na memória
   e mostra o aviso "seu progresso não será salvo". */
const Armazem = (function () {
  let ls = null, ok = false;
  try {
    ls = window.localStorage;
    ls.setItem('__codivara_teste__', '1');
    ls.removeItem('__codivara_teste__');
    ok = true;
  } catch (e) { ls = null; ok = false; }
  return {
    salvo: function () { return ok; },
    ler: function () {
      if (!ls) return null;
      try { const bruto = ls.getItem(CHAVE); return bruto ? JSON.parse(bruto) : null; } catch (e) { return null; }
    },
    gravar: function (obj) {
      if (!ls) { ok = false; return false; }
      try { ls.setItem(CHAVE, JSON.stringify(obj)); ok = true; return true; } catch (e) { ok = false; return false; }
    },
    limpar: function () { try { if (ls) ls.removeItem(CHAVE); } catch (e) { /* sem problema */ } }
  };
})();

const TODAS_LICOES = CURSO.unidades.reduce(function (todas, u) { return todas.concat((u && u.licoes) || []); }, []);

function estadoPadrao() {
  return { v: 1, xp: 0, sequencia: 0, ultimoDia: null, licoes: {}, conquistas: {} };
}

/* Lê o que veio do armazenamento com desconfiança: só aceita o que tem o formato esperado. */
function normalizar(o) {
  const e = estadoPadrao();
  if (!o || typeof o !== 'object') return e;
  if (Number.isFinite(o.xp) && o.xp >= 0) e.xp = Math.floor(o.xp);
  if (Number.isFinite(o.sequencia) && o.sequencia >= 0) e.sequencia = Math.floor(o.sequencia);
  if (typeof o.ultimoDia === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(o.ultimoDia)) e.ultimoDia = o.ultimoDia;
  if (o.licoes && typeof o.licoes === 'object') {
    TODAS_LICOES.forEach(function (l) {
      const x = o.licoes[l.id];
      if (x && x.feita === true) {
        e.licoes[l.id] = {
          feita: true,
          vezes: Number.isFinite(x.vezes) && x.vezes > 0 ? Math.floor(x.vezes) : 1,
          melhor: Number.isFinite(x.melhor) ? Math.max(0, Math.min(100, Math.round(x.melhor))) : 0,
          semErros: x.semErros === true
        };
      }
    });
  }
  if (o.conquistas && typeof o.conquistas === 'object') {
    CONQUISTAS.forEach(function (c) { if (typeof o.conquistas[c.id] === 'string') e.conquistas[c.id] = o.conquistas[c.id]; });
  }
  return e;
}

let estado = normalizar(Armazem.ler());

function salvar() { return Armazem.gravar(estado); }

function reiniciarProgresso() {
  estado = estadoPadrao();
  Armazem.limpar();
}

/* ---------- consultas ---------- */
function licaoFeita(id) { return !!(estado.licoes[id] && estado.licoes[id].feita); }
function licaoLiberada(i) { return i === 0 || licaoFeita(TODAS_LICOES[i - 1].id); }
function totalFeitas() { return TODAS_LICOES.filter(function (l) { return licaoFeita(l.id); }).length; }
function praticouHoje() { return estado.ultimoDia === hoje(); }
/* A sequência só "vale" se a última lição foi hoje ou ontem; senão ela já quebrou (mostra 0). */
function sequenciaAtual() {
  if (!estado.ultimoDia) return 0;
  return diasEntre(estado.ultimoDia, hoje()) <= 1 ? estado.sequencia : 0;
}

/* ---------- conquistas ---------- */
function cumpreRegra(regra, ctx) {
  if (regra.tipo === 'licoes') return ctx.licoesFeitas >= regra.min;
  if (regra.tipo === 'semErros') return ctx.semErros === true;
  if (regra.tipo === 'sequencia') return ctx.sequencia >= regra.min;
  return false;
}

/* ---------- concluir uma lição: é AQUI (e só aqui) que o XP entra no total ---------- */
function registrarConclusao(licao, s) {
  const precisao = s.respostas ? Math.round(100 * s.acertos / s.respostas) : 100;
  const semErros = s.erros === 0;
  const antes = estado.licoes[licao.id];
  const t = hoje();

  estado.xp += s.xp;
  estado.licoes[licao.id] = {
    feita: true,
    vezes: (antes ? antes.vezes : 0) + 1,
    melhor: Math.max(antes ? antes.melhor : 0, precisao),
    semErros: !!(antes && antes.semErros) || semErros
  };

  /* sequência diária: dias seguidos com pelo menos 1 lição concluída */
  if (!estado.ultimoDia) {
    estado.sequencia = 1;
  } else {
    const d = diasEntre(estado.ultimoDia, t);
    if (d === 1) estado.sequencia += 1;          // ontem → soma
    else if (d > 1) estado.sequencia = 1;        // passou de um dia → recomeça
    else if (estado.sequencia < 1) estado.sequencia = 1;   // mesmo dia (ou relógio voltou) → mantém
  }
  if (!estado.ultimoDia || diasEntre(estado.ultimoDia, t) >= 0) estado.ultimoDia = t;

  const ctx = { licoesFeitas: totalFeitas(), semErros: semErros, sequencia: estado.sequencia };
  const novas = [];
  CONQUISTAS.forEach(function (c) {
    if (!estado.conquistas[c.id] && cumpreRegra(c.regra, ctx)) { estado.conquistas[c.id] = t; novas.push(c); }
  });

  salvar();
  return { precisao: precisao, novas: novas, xp: s.xp, sequencia: estado.sequencia, semErros: semErros };
}

/* ---------- janela (modal) própria: confirm() não funciona em todo lugar ---------- */
let modalAtivo = null;
function abrirModal(opc) {
  fecharModal(true);

  fundo.className = 'fundo-modal';
  fundo.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-t" tabindex="-1">' +
    '<h2 id="modal-t">' + esc(opc.titulo) + '</h2><div class="corpo-modal">' + opc.html + '</div><div class="acoes-modal"></div></div>';

    const itens = $$('button, [href], input, select, textarea', modalAtivo.fundo).filter(function (x) { return !x.disabled; });

    const a = itens[0], z = itens[itens.length - 1];

  }

/* =====================================================================
   5a. JOGO 1 — QUIZ: "O que este código imprime?" (múltipla escolha)
   Todo jogo é um objeto com criar(ex, io). Ele devolve:
     el        -> elemento que o motor coloca na tela
     verificar -> { ok: true/false }  (ou { parcial: true } se ainda há uma 2ª etapa)
     revelar   -> pinta certo/errado depois da resposta
     certa     -> HTML com a resposta certa (mostrado quando o aluno erra)
   io.pronto(true/false) liga e desliga o botão "Verificar".
   ===================================================================== */
JOGOS.quiz = {
  nome: 'Quiz',
  rotulo: 'Verificar',
  criar: function (ex, io) {
    /* a PRIMEIRA opção escrita no conteúdo é a certa; aqui elas são embaralhadas */
    const itens = embaralhar(ex.opcoes.map(function (t, i) { return { t: t, certa: i === 0 }; }));
    const el = document.createElement('div');
    el.className = 'jogo';
    el.innerHTML = (ex.codigo ? blocoCodigo(ex.codigo, 'Código do exercício') : '') +
      '<div class="opcoes" role="radiogroup" aria-label="Opções de resposta">' +
      itens.map(function (o, i) {
        return '<label class="opt"><input class="sr" type="radio" name="quiz" value="' + i + '">' +
          '<span class="tecla" aria-hidden="true">' + (i + 1) + '</span>' +
          '<span class="txt">' + esc(o.t) + '</span><span class="res"></span></label>';
      }).join('') + '</div>';
    const rotulos = $$('.opt', el), radios = $$('input', el);
    let travado = false;

    function escolhido() { return radios.findIndex(function (r) { return r.checked; }); }

    radios.forEach(function (r, i) {
      r.addEventListener('change', function () {
        rotulos.forEach(function (l, j) { l.classList.toggle('sel', j === i); });
        io.pronto(true);
      });
    });

    /* atalho: teclas 1, 2, 3, 4 escolhem a opção */
    function teclas(e) {
      if (!el.isConnected) { document.removeEventListener('keydown', teclas); return; }
      if (travado || modalAtivo || e.ctrlKey || e.metaKey || e.altKey) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= itens.length) {
        radios[n - 1].checked = true;
        radios[n - 1].dispatchEvent(new Event('change'));
        radios[n - 1].focus();
      }
    }
    document.addEventListener('keydown', teclas);

    return {
      el: el,
      verificar: function () {
        const i = escolhido();
        return { ok: i >= 0 && itens[i].certa };
      },
      revelar: function () {
        travado = true;
        const i = escolhido();
        radios.forEach(function (r) { r.disabled = true; });
        rotulos.forEach(function (l, j) {
          l.classList.add('travada');
          const res = $('.res', l);
          if (itens[j].certa) {
            l.classList.add('certa');
            res.innerHTML = icone('check') + '<span class="sr">resposta certa</span>';
          } else if (j === i) {
            l.classList.add('errada');
            res.innerHTML = icone('x') + '<span class="sr">sua resposta, errada</span>';
          }
        });
      },
      certa: function () {
        const c = itens.find(function (o) { return o.certa; });
        return blocoSaida(c.t);
      }
    };
  }
};

      certa: function () {

/* =====================================================================
   5c. JOGO 3 — MONTE O CÓDIGO
   Toque numa linha do banco: ela vai para a primeira posição vazia.
   Para escolher a posição, toque antes numa posição vazia e depois na linha.
   Toque numa linha já colocada para devolvê-la ao banco. (Sem arrastar.)
   ===================================================================== */
JOGOS.monte = {
  nome: 'Monte o Código',
  rotulo: 'Verificar',
  criar: function (ex, io) {
    const n = ex.linhas.length;
    /* embaralha, mas nunca entrega a ordem certa de bandeja */
    const itens = embaralhar(ex.linhas.map(function (t, i) { return { id: i, t: t }; }),
      function (r) { return r.every(function (x, k) { return x.t === ex.linhas[k]; }); });
    const slots = new Array(n).fill(null);     // em cada posição: o item colocado (ou null)
    let alvo = null, travado = false, resultado = null;

    const el = document.createElement('div');
    el.className = 'jogo';
    el.innerHTML = (ex.saida ? '<div><span class="saida-rotulo" style="margin-top:0">O programa deve mostrar</span>' + blocoSaida(ex.saida) + '</div>' : '') +
      '<div><span class="saida-rotulo" id="mt-slots" style="margin-top:0">Seu código</span><ol class="slots" aria-labelledby="mt-slots"></ol></div>' +
      '<div><span class="saida-rotulo" id="mt-banco" style="margin-top:0">Linhas disponíveis (toque para colocar)</span><div class="banco" role="group" aria-labelledby="mt-banco"></div></div>';
    const lista = $('.slots', el), banco = $('.banco', el);

    function noBanco() { return itens.filter(function (it) { return slots.indexOf(it) < 0; }); }

    /* foco = { slot: i } ou { chip: posição } (-1 = não há mais chips: foca o botão de ação) */
    function desenhar(foco) {
      lista.innerHTML = slots.map(function (it, i) {
        const estado = resultado ? (resultado[i] ? ' certo' : ' errado') : '';
        const rot = 'Linha ' + (i + 1) + ': ' + (it ? it.t + '. Toque para devolver ao banco.' : 'vazia. Toque para escolher esta posição.');
        return '<li><button type="button" class="slot' + (it ? ' cheio' : '') + (alvo === i ? ' alvo' : '') + estado + '" data-i="' + i + '"' +
          (it ? '' : ' aria-pressed="' + (alvo === i) + '"') + ' aria-label="' + esc(rot) + '"' + (travado ? ' disabled' : '') + '>' +
          '<span class="n" aria-hidden="true">' + (i + 1) + '</span><span class="t">' + (it ? colorir(it.t) : (alvo === i ? 'Agora toque numa linha abaixo' : '')) + '</span></button></li>';
      }).join('');
      banco.innerHTML = noBanco().map(function (it) {
        return '<button type="button" class="chip" data-id="' + it.id + '"' + (travado ? ' disabled' : '') + '>' + colorir(it.t) + '</button>';
      }).join('');
      io.pronto(!travado && slots.every(Boolean));
      if (foco) {
        if (foco.slot !== undefined) {
          const b = $('.slot[data-i="' + foco.slot + '"]', lista);
          if (b) b.focus();
        } else if (foco.chip >= 0) {
          const c = $$('.chip', banco)[foco.chip];
          if (c) c.focus();
        } else if (io.focoAcao) io.focoAcao();
      }
    }

    function colocar(id) {
      const antes = noBanco();
      const posChip = antes.findIndex(function (x) { return x.id === id; });
      const it = antes[posChip];
      if (!it) return;
      const pos = (alvo !== null && !slots[alvo]) ? alvo : slots.indexOf(null);
      if (pos < 0) return;
      slots[pos] = it;
      alvo = null;
      const restam = noBanco().length;
      desenhar({ chip: restam ? Math.min(posChip, restam - 1) : -1 });
    }
    function tocarSlot(i) {
      if (slots[i]) { slots[i] = null; alvo = null; }
      else { alvo = (alvo === i) ? null : i; }
      desenhar({ slot: i });
    }

    el.addEventListener('click', function (e) {
      if (travado) return;
      const chip = e.target.closest('.chip'), slot = e.target.closest('.slot');
      if (chip) colocar(+chip.dataset.id);
      else if (slot) tocarSlot(+slot.dataset.i);
    });
    desenhar();

    return {
      el: el,
      verificar: function () {
        return { ok: slots.every(function (it, k) { return it && it.t === ex.linhas[k]; }) };
      },
      revelar: function () {
        travado = true;
        resultado = slots.map(function (it, k) { return it && it.t === ex.linhas[k]; });
        desenhar();
      },
      certa: function () { return blocoCodigo(ex.linhas.join('\n'), 'Ordem certa'); }
    };
  }
};

/* =====================================================================
   5d. JOGO 4 — COMPLETE A LACUNA
   O código tem buracos ({1}, {2}...) e embaixo há um banco de palavras.
   Toque numa palavra: ela vai para o primeiro buraco vazio (ou para o buraco que você tocou antes).
   Toque num buraco preenchido para tirar a palavra.
   ===================================================================== */
function preencherLacunas(codigo, palavras) {
  return palavras.reduce(function (c, p, i) { return c.split('{' + (i + 1) + '}').join(p); }, codigo);
}

JOGOS.lacuna = {
  nome: 'Complete a Lacuna',
  rotulo: 'Verificar',
  criar: function (ex, io) {
    const nb = ex.respostas.length;
    const palavras = embaralhar(ex.banco.map(function (t, i) { return { id: i, t: t }; }));
    const preench = new Array(nb).fill(null);     // em cada buraco: a palavra colocada (ou null)
    let alvo = null, travado = false, resultado = null;

    /* o código vira linhas; cada {n} vira um botão (buraco) */
    const linhasHtml = ex.codigo.split('\n').map(function (linha, i) {
      const partes = linha.split(/(\{\d+\})/).map(function (p) {
        const m = /^\{(\d+)\}$/.exec(p);
        return m ? '<button type="button" class="buraco" data-n="' + (+m[1] - 1) + '"></button>' : colorir(p);
      }).join('');
      return '<div class="l"><span class="n" aria-hidden="true">' + (i + 1) + '</span><span class="t">' + partes + '</span></div>';
    }).join('');

    const el = document.createElement('div');
    el.className = 'jogo';
    el.innerHTML = (ex.saida ? '<div><span class="saida-rotulo" style="margin-top:0">O programa deve mostrar</span>' + blocoSaida(ex.saida) + '</div>' : '') +
      '<div class="cod" role="group" aria-label="Código com lacunas">' + linhasHtml + '</div>' +
      '<div><span class="saida-rotulo" id="lc-banco" style="margin-top:0">Palavras disponíveis (toque para colocar)</span><div class="banco" role="group" aria-labelledby="lc-banco"></div></div>';
    const banco = $('.banco', el);

    function disponiveis() { return palavras.filter(function (p) { return preench.indexOf(p) < 0; }); }

    function atualizar(foco) {
      $$('.buraco', el).forEach(function (b) {
        const k = +b.dataset.n, p = preench[k];
        b.textContent = p ? p.t : '___';
        b.className = 'buraco' + (p ? ' cheio' : '') + (alvo === k ? ' alvo' : '') + (resultado ? (resultado[k] ? ' certo' : ' errado') : '');
        b.disabled = travado;
        b.setAttribute('aria-label', 'Lacuna ' + (k + 1) + ': ' + (p ? p.t + '. Toque para tirar a palavra.' : 'vazia'));
        if (!p) b.setAttribute('aria-pressed', alvo === k ? 'true' : 'false'); else b.removeAttribute('aria-pressed');
      });
      const cheio = preench.every(Boolean);
      banco.innerHTML = disponiveis().map(function (p) {
        return '<button type="button" class="chip" data-id="' + p.id + '"' + ((cheio || travado) ? ' disabled' : '') + '>' + esc(p.t) + '</button>';
      }).join('');
      io.pronto(!travado && cheio);
      if (foco) {
        if (foco.buraco !== undefined) { const b = $('.buraco[data-n="' + foco.buraco + '"]', el); if (b) b.focus(); }
        else if (foco.chip >= 0) { const c = $$('.chip', banco)[foco.chip]; if (c) c.focus(); }
        else if (io.focoAcao) io.focoAcao();
      }
    }

    function colocar(id) {
      const antes = disponiveis();
      const posChip = antes.findIndex(function (x) { return x.id === id; });
      const p = antes[posChip];
      if (!p) return;
      const pos = alvo !== null ? alvo : preench.indexOf(null);
      if (pos < 0) return;
      preench[pos] = p;                       // se o buraco já tinha palavra, ela volta sozinha para o banco
      alvo = null;
      const restam = disponiveis().length;
      atualizar({ chip: (restam && preench.indexOf(null) >= 0) ? Math.min(posChip, restam - 1) : -1 });
    }
    function tocarBuraco(k) {
      if (preench[k]) { preench[k] = null; alvo = null; }
      else { alvo = (alvo === k) ? null : k; }
      atualizar({ buraco: k });
    }

    el.addEventListener('click', function (e) {
      if (travado) return;
      const chip = e.target.closest('.chip'), b = e.target.closest('.buraco');
      if (chip) colocar(+chip.dataset.id);
      else if (b) tocarBuraco(+b.dataset.n);
    });
    atualizar();

    return {
      el: el,
      verificar: function () {
        return { ok: preench.every(function (p, k) { return p && p.t === ex.respostas[k]; }) };
      },
      revelar: function () {
        travado = true;
        resultado = preench.map(function (p, k) { return p && p.t === ex.respostas[k]; });
        atualizar();
      },
      certa: function () { return blocoCodigo(preencherLacunas(ex.codigo, ex.respostas), 'Código completo'); }
    };
  }
};

/* =====================================================================
   5e. JOGO 5 — LIGUE OS PARES
   Toque num item da esquerda e num da direita. Se combinam, os dois ficam da mesma cor.
   Se não combinam, eles tremem e você tenta de novo. A primeira ligação errada faz o
   exercício contar como erro (ele volta no fim da lição), mas você pode terminar de ligar.
   ===================================================================== */
JOGOS.pares = {
  nome: 'Ligue os Pares',
  rotulo: 'Concluir',
  criar: function (ex, io) {
    const n = ex.pares.length;
    const esq = ex.pares.map(function (p, i) { return { id: i, t: p[0] }; });
    const dir = embaralhar(ex.pares.map(function (p, i) { return { id: i, t: p[1] }; }),
      function (r) { return r.every(function (x, k) { return x.id === k; }); });
    const cores = ['#CFF3EE', '#E6DCFB', '#FFE2B8', '#FFD3E1', '#D5E9FF', '#E4F3C8'];
    const casados = {};                 // id do par -> índice da cor
    let selE = null, selD = null, errE = null, errD = null, errou = false, travado = false, nCasados = 0;

    const el = document.createElement('div');
    el.className = 'jogo';
    el.innerHTML = '<p class="instr" id="pr-instr">Toque num item de cada coluna para ligar os dois.</p>' +
      '<div class="pares" role="group" aria-labelledby="pr-instr"><div class="col" data-lado="e"></div><div class="col" data-lado="d"></div></div>' +
      '<p class="dica-pares" role="status"></p>';
    const colE = $('.col[data-lado="e"]', el), colD = $('.col[data-lado="d"]', el), dica = $('.dica-pares', el);

    function botao(lado, it) {
      const casado = casados[it.id] !== undefined;
      const sel = (lado === 'e' ? selE : selD) === it.id;
      const erro = (lado === 'e' ? errE : errD) === it.id;
      const mono = lado === 'e' ? ex.esqCodigo : ex.dirCodigo;
      return '<button type="button" class="par' + (mono ? ' mono' : '') + (casado ? ' casado' : '') + (erro ? ' erro' : '') + '" data-id="' + it.id + '"' +
        (casado ? ' style="--c:' + cores[casados[it.id]] + '"' : '') + ' aria-pressed="' + sel + '"' +
        (casado ? ' aria-label="' + esc(it.t) + ' (já ligado)"' : '') + ((casado || travado) ? ' disabled' : '') + '>' + esc(it.t) + '</button>';
    }
    function desenhar(foco) {
      colE.innerHTML = esq.map(function (it) { return botao('e', it); }).join('');
      colD.innerHTML = dir.map(function (it) { return botao('d', it); }).join('');
      io.pronto(!travado && nCasados === n);
      if (!foco) return;
      const col = foco.lado === 'e' ? colE : colD;
      let b = $('.par[data-id="' + foco.id + '"]', col);
      if (!b || b.disabled) b = $('.par:not(:disabled)', col) || $('.par:not(:disabled)', el);
      if (b) b.focus(); else if (io.focoAcao) io.focoAcao();
    }
    function mensagem(txt, ruim) { dica.textContent = txt; dica.className = 'dica-pares' + (ruim ? ' ruim' : ''); }

    function tentar() {
      const e = selE, d = selD;
      selE = selD = null;
      if (e === d) {
        casados[e] = nCasados % cores.length;
        nCasados++;
        mensagem(nCasados === n ? 'Todos ligados! Toque em Concluir.' : 'Isso mesmo!', false);
      } else {
        errou = true;
        errE = e; errD = d;
        mensagem('Esses dois não combinam. Tente de novo.', true);
        setTimeout(function () {
          errE = errD = null;
          if (!el.isConnected || travado) return;
          /* redesenhar troca os botões: guarda onde estava o foco do teclado e devolve depois */
          const ativo = document.activeElement;
          const estavaAqui = ativo && ativo.classList && ativo.classList.contains('par') && el.contains(ativo);
          desenhar(estavaAqui ? { lado: ativo.parentElement.dataset.lado, id: +ativo.dataset.id } : null);
        }, 650);
      }
    }

    el.addEventListener('click', function (ev) {
      if (travado) return;
      const b = ev.target.closest('.par');
      if (!b || b.disabled) return;
      const lado = b.parentElement.dataset.lado, id = +b.dataset.id;
      if (lado === 'e') selE = (selE === id) ? null : id; else selD = (selD === id) ? null : id;
      if (selE !== null && selD !== null) tentar();
      desenhar({ lado: lado, id: id });
    });
    desenhar();

    return {
      el: el,
      verificar: function () { return { ok: !errou }; },
      revelar: function () { travado = true; desenhar(); },
      certa: function () {
        return '<ul class="lista-pares">' + ex.pares.map(function (p) {
          return '<li><code>' + esc(p[0]) + '</code> → <code>' + esc(p[1]) + '</code></li>';
        }).join('') + '</ul>';
      }
    };
  }
};

/* =====================================================================
   6. A LIÇÃO: fila de exercícios, vidas, XP, feedback e repetição dos erros
   Regras:
   - 5 vidas por lição. Cada resposta errada tira 1 vida. Zerou: a lição recomeça do início.
   - Exercício errado volta no FIM da fila e só sai quando for acertado.
   - XP: acertou de primeira = APP.xpPrimeiraVez; acertou depois de errar = APP.xpRepeticao.
     O XP da lição só é somado ao total quando a lição termina (veja registrarConclusao).
   ===================================================================== */
const ROTULO_CERTA = { quiz: 'Resposta certa', bug: 'Código corrigido', monte: 'Ordem certa', lacuna: 'Código completo', pares: 'Os pares certos' };

const Licao = {
  s: null,    // a sessão da lição em andamento

  iniciar: function (licao) {
    this.s = {
      licao: licao, total: licao.exercicios.length,
      fila: licao.exercicios.map(function (_, i) { return i; }),
      feitos: 0, vidas: APP.vidasPorLicao, xp: 0, acertos: 0, erros: 0, respostas: 0,
      tentativas: {}, jogo: null, ex: null, fase: 'responder'
    };
    ui.tela = 'licao';
    ui.licaoId = licao.id;
    render();
    this.mostrar();
  },

  /* mostra o exercício que está na frente da fila */
  mostrar: function () {
    const s = this.s, ex = s.licao.exercicios[s.fila[0]], tipo = JOGOS[ex.tipo];
    s.ex = ex;
    s.fase = 'responder';
    $('#tipo').textContent = tipo.nome;
    $('#enunciado').textContent = ex.enunciado;
    const v = $('#verificar');
    v.disabled = true;                           // só liga quando o aluno responder algo
    v.textContent = tipo.rotulo;
    const area = $('#jogo-area');
    area.innerHTML = '';
    s.jogo = tipo.criar(ex, {
      pronto: function (ok) { const b = $('#verificar'); if (b) b.disabled = !ok; },
      focoAcao: function () { focar('#verificar'); }
    });
    area.appendChild(s.jogo.el);
    $('#rodape').className = 'rodape-acao';
    $('#fb').innerHTML = '';
    $('#acao').hidden = false;
    this.topo(false);
    focar('#enunciado');
    window.scrollTo(0, 0);
  },

  /* barra de progresso e vidas */
  topo: function (perdeuVida) {

    $('.prog').setAttribute('aria-valuenow', s.feitos);
    $('.prog-i').style.width = Math.round(100 * s.feitos / s.total) + '%';
    const v = $('#vidas');
    $('#vidas-n').textContent = s.vidas;
    v.setAttribute('aria-label', 'Vidas: ' + s.vidas + ' de ' + APP.vidasPorLicao);
    v.classList.toggle('pouca', s.vidas <= 1);
    v.classList.remove('anim-tremer');
    if (perdeuVida) { void v.offsetWidth; v.classList.add('anim-tremer'); }
  },

  verificar: function () {
    const s = this.s;
    if (!s || s.fase !== 'responder') return;
    const r = s.jogo.verificar();
    if (r.parcial) return;                       // Caça ao Bug: acertou a linha, falta escolher a correção
    s.fase = 'feedback';
    const i = s.fila.shift();
    const antes = s.tentativas[i] || 0;
    let xp = 0;
    s.respostas++;

      s.acertos++; s.feitos++;

    } else {

  feedback: function (ok, xp) {

    let extra = '';
    if (ex.tipo === 'bug' && ex.erro) {
      extra += '<div class="fb-extra"><span class="etiqueta">O Python avisaria algo como</span><code>' + esc(ex.erro) + '</code></div>';
    }
    if (!ok) {
      extra += '<div class="fb-extra"><span class="etiqueta">' + ROTULO_CERTA[ex.tipo] + '</span>' + s.jogo.certa() +

    const volta = ok ? '' : '<p class="fb-volta">' + (s.vidas > 0 ? 'Este exercício volta no fim da lição.' : 'Suas vidas acabaram.') + '</p>';

    $('#fb').innerHTML =
      '<div class="fb-corpo">' +
        '<div class="fb-cab">' + capi(ok ? 'feliz' : 'triste', 56) + '<div><span class="fb-tit">' + esc(sortear(FRASES[ok ? 'acerto' : 'erro'])) + '</span>' +
        (ok ? '<span class="fb-xp" data-flutua="+' + xp + ' XP">+' + xp + ' XP</span>' : '') + '</div></div>' +
        '<p class="fb-txt">' + fmt(texto) + '</p>' + extra + volta +
      '</div>' +
      '<button type="button" class="btn ' + (ok ? 'btn-ok' : 'btn-ruim') + ' btn-cheio" id="continuar" data-acao="continuar">Continuar</button>';

  concluir: function () {
    const s = this.s;
    const res = registrarConclusao(s.licao, s);
    res.vidas = s.vidas;
    res.licao = s.licao;
    ui.fim = res;
    this.s = null;
    irPara('fim');
  },

  sair: function () {
    abrirModal({
      titulo: 'Sair da lição?',
      html: '<p>Se você sair agora, perde o progresso desta lição. O XP só entra no total quando você termina.</p>',
      botoes: [
        { rotulo: 'Continuar a lição', classe: 'btn-primario' },
        { rotulo: 'Sair da lição', acao: function () { Licao.s = null; irPara('trilha'); } }
      ]
    });
  },

  resumo: function () {
    abrirModal({
      titulo: 'Resumo: ' + this.s.licao.titulo,
      html: conceitoHtml(this.s.licao),
      botoes: [{ rotulo: 'Voltar para a lição', classe: 'btn-primario' }]
    });
  }
};

function telaLicao(app) {
  const s = Licao.s;
  app.innerHTML =
    '<div class="licao">' +
      '<header class="barra">' +
        '<button type="button" class="btn-icone" data-acao="sair" aria-label="Sair da lição">' + icone('x') + '</button>' +
        '<div class="prog" role="progressbar" aria-label="Progresso da lição" aria-valuemin="0" aria-valuemax="' + s.total + '" aria-valuenow="0"><div class="prog-i" style="width:0%"></div></div>' +
        '<button type="button" class="btn-icone" data-acao="resumo" aria-label="Rever o resumo da lição">' + icone('bulb') + '</button>' +
        '<div class="chip-stat vidas" id="vidas" role="img" aria-label="Vidas: ' + s.vidas + ' de ' + APP.vidasPorLicao + '">' + icone('heart') + '<span id="vidas-n">' + s.vidas + '</span></div>' +
      '</header>' +
      '<main id="principal" tabindex="-1" class="corpo">' +
        '<div class="tipo"><span class="etiqueta" id="tipo"></span></div>' +
        '<h1 id="enunciado" tabindex="-1"></h1>' +
        '<div id="jogo-area"></div>' +
      '</main>' +
      '<footer class="rodape-acao" id="rodape">' +
        '<div id="acao"><button type="button" class="btn btn-primario btn-cheio" id="verificar" data-acao="verificar" disabled>Verificar</button></div>' +
        '<div id="fb" class="fb" aria-live="polite"></div>' +
      '</footer>' +
    '</div>';
}

ACOES.verificar = function () { Licao.verificar(); };
ACOES.continuar = function () { Licao.continuar(); };
ACOES.sair = function () { Licao.sair(); };
ACOES.resumo = function () { Licao.resumo(); };

/* >>> src/js/7-telas.js */

/* =====================================================================
   7. TELAS: trilha (início), começo da lição e fim da lição
   ===================================================================== */
function licaoPorId(id) { return TODAS_LICOES.find(function (l) { return l.id === id; }); }
function plural(n, um, varios) { return n + ' ' + (n === 1 ? um : varios); }

/* texto do resumo da lição (usado na tela de começo e na janela "Resumo") */
function conceitoHtml(l) {
  const it = l.intro;
  return '<div class="conceito">' +
    it.paragrafos.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') +
    (it.lista ? '<ul>' + it.lista.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>' : '') +
    (it.depois ? it.depois.map(function (p) { return '<p>' + fmt(p) + '</p>'; }).join('') : '') +
    '<span class="etiqueta">Exemplo</span>' + blocoCodigo(it.exemplo.codigo, 'Exemplo de código') +
    '<span class="saida-rotulo" style="margin:0">Na tela aparece</span>' + blocoSaida(it.exemplo.saida) +
    (it.exemplo.nota ? '<p class="instr">' + esc(it.exemplo.nota) + '</p>' : '') +
    '</div>';
}

function avisoArmazenamento() {
  if (Armazem.salvo()) return '';
  return '<div class="aviso" role="status">' + icone('aviso') + '<div><strong>Seu progresso não será salvo.</strong> O navegador está bloqueando o armazenamento deste site. ' +
    'Você pode continuar usando normalmente, mas ao fechar ou recarregar a página o progresso some.</div></div>';
}

function mensagemCapi() {
  const feitas = totalFeitas(), total = TODAS_LICOES.length, seq = sequenciaAtual();
  if (feitas === 0) return { humor: 'feliz', t: 'Oi! Eu sou o ' + APP.mascote + '.', s: 'Vamos aprender Python juntos? Comece pela Lição 1.' };
  if (feitas >= total) return { humor: 'festa', t: 'Você concluiu todas as lições!', s: 'Refaça para treinar. Mais lições vêm nas próximas fases.' };
  if (praticouHoje()) return { humor: 'feliz', t: 'Boa! Você já praticou hoje.', s: 'Sequência de ' + plural(seq, 'dia', 'dias') + '. Que tal mais uma lição?' };
  if (seq > 0) return { humor: 'neutro', t: 'Sua sequência é de ' + plural(seq, 'dia', 'dias') + '.', s: 'Faça uma lição hoje para mantê-la.' };
  return { humor: 'neutro', t: 'Que bom ver você de volta!', s: 'Continue de onde parou.' };
}

/* link para o site que hospeda o jogo (só aparece se APP.voltar estiver preenchido; no arquivo avulso fica sem link) */
function voltarSite() {
  if (!APP.voltar) return '';
  return '<nav class="voltar-site" aria-label="Voltar ao ' + esc(APP.voltar.texto) + '"><a href="' + esc(APP.voltar.href) + '">← ' + esc(APP.voltar.texto) + '</a></nav>';
}

/* ---------- tela inicial: a trilha ---------- */
function telaTrilha(app) {
  const seq = sequenciaAtual(), msg = mensagemCapi();
  let indice = 0;
  const unidades = CURSO.unidades.map(function (u) {
    const nos = u.licoes.map(function (l) {
      const i = indice++;
      const feita = licaoFeita(l.id), liberada = licaoLiberada(i), atual = liberada && !feita;
      const classe = feita ? 'concluida' : (atual ? 'disponivel atual' : 'bloqueada');
      const estadoTxt = feita ? 'concluída' : (liberada ? 'disponível' : 'bloqueada');
      const dados = estado.licoes[l.id];
      return '<li style="--d:' + [0, 1, 0, -1][i % 4] + '">' +
        '<button type="button" class="no ' + classe + '" data-acao="abrir" data-id="' + l.id + '"' + (liberada ? '' : ' aria-disabled="true"') +
        ' aria-label="Lição ' + (i + 1) + ': ' + esc(l.titulo) + ', ' + estadoTxt + '">' + icone(feita ? 'check' : (liberada ? 'play' : 'lock')) + '</button>' +
        '<div class="rotulo-no"><b>Lição ' + (i + 1) + '</b><span>' + esc(l.titulo) + '</span></div>' +
        (feita && dados && dados.semErros ? '<span class="selo">' + icone('check') + 'Sem erros</span>' : '') +
        '</li>';
    }).join('');
    return '<section class="unidade" aria-labelledby="un-' + u.id + '"><h2 id="un-' + u.id + '">' + esc(u.titulo) + '</h2><p>' + esc(u.descricao) + '</p></section>' +
      '<ol class="trilha" aria-labelledby="un-' + u.id + '">' + nos + '</ol>';
  }).join('');

  const conq = CONQUISTAS.map(function (c) {
    const ganha = !!estado.conquistas[c.id];
    return '<li class="conq' + (ganha ? '' : ' trancada') + '"><span class="medalha">' + icone(ganha ? c.icone : 'lock') + '</span>' +
      '<b>' + esc(c.titulo) + '</b><span>' + esc(c.descricao) + '</span><span class="estado">' + (ganha ? 'Desbloqueada' : 'Bloqueada') + '</span></li>';
  }).join('');

  app.innerHTML =
    voltarSite() +
    '<header class="topo">' +
      '<p class="marca">' + capi('feliz', 40) + '<span>' + esc(APP.nome) + '</span></p>' +
      '<div class="stats">' +
        '<div class="chip-stat chama' + (seq ? '' : ' apagada') + '" role="img" aria-label="Sequência: ' + plural(seq, 'dia', 'dias') + '">' + icone('flame') + '<span>' + seq + '</span></div>' +
        '<div class="chip-stat xp" role="img" aria-label="XP total: ' + estado.xp + '">' + icone('bolt') + '<span>' + estado.xp + ' XP</span></div>' +
      '</div>' +
    '</header>' +
    '<main id="principal" tabindex="-1">' +
      avisoArmazenamento() +
      '<h1 id="titulo" tabindex="-1" class="sr">Trilha de lições</h1>' +
      '<div class="hero">' + capi(msg.humor, 92) + '<div class="balao">' + esc(msg.t) + '<small>' + esc(msg.s) + '</small></div></div>' +
      unidades +
      '<h2 class="sec-titulo">Conquistas</h2><ul class="conquistas">' + conq + '</ul>' +
      '<div class="rodape"><button type="button" class="btn btn-link" data-acao="reiniciar">Reiniciar progresso</button>' +
      '<span>' + esc(APP.nome) + ' funciona sem internet. O progresso fica salvo neste navegador.</span></div>' +
    '</main>';
}

/* ---------- começo da lição: resumo + botão Começar ---------- */
function telaInicio(app) {
  const l = licaoPorId(ui.licaoId), i = TODAS_LICOES.indexOf(l), feita = licaoFeita(l.id);
  app.innerHTML =
    '<main id="principal" tabindex="-1" class="inicio">' +
      '<div class="topo-inicio"><button type="button" class="btn btn-link" data-acao="voltar">← Voltar à trilha</button></div>' +
      '<div><span class="etiqueta">Lição ' + (i + 1) + ' de ' + TODAS_LICOES.length + ' · ' + esc(l.resumo) + '</span>' +
      '<h1 id="titulo" tabindex="-1">' + esc(l.titulo) + '</h1></div>' +
      '<div class="cartao"><h2 style="margin-bottom:10px">Antes de começar</h2>' + conceitoHtml(l) + '</div>' +
      '<p class="instr">' + l.exercicios.length + ' exercícios · cerca de 5 minutos · ' + APP.vidasPorLicao + ' vidas. Você pode rever este resumo durante a lição.</p>' +
      '<div class="acoes-inicio"><button type="button" class="btn btn-primario btn-cheio" data-acao="comecar">' + (feita ? 'Praticar de novo' : 'Começar') + '</button></div>' +
    '</main>';
}

/* ---------- fim da lição ---------- */
function telaFim(app) {
  const r = ui.fim, i = TODAS_LICOES.indexOf(r.licao);
  const proxima = TODAS_LICOES[i + 1];
  const novas = r.novas.map(function (c) {
    return '<div class="nova"><span class="medalha">' + icone(c.icone) + '</span><div><b>Conquista: ' + esc(c.titulo) + '</b><small>' + esc(c.descricao) + '</small></div></div>';
  }).join('');
  app.innerHTML =
    '<main id="principal" tabindex="-1" class="fim">' +
      '<div class="confete" aria-hidden="true"></div>' +
      avisoArmazenamento() +
      capi('festa', 150) +
      '<div><h1 id="titulo" tabindex="-1">Lição concluída!</h1><p class="sub">' + esc(r.licao.titulo) + (r.semErros ? ' · sem nenhum erro' : '') + '</p></div>' +
      '<div class="resultados">' +
        '<div class="res xp">' + icone('bolt') + '<b>+' + r.xp + '</b><span>XP</span></div>' +
        '<div class="res prec">' + icone('alvo') + '<b>' + r.precisao + '%</b><span>Acertos</span></div>' +
        '<div class="res vid">' + icone('heart') + '<b>' + r.vidas + '</b><span>Vidas</span></div>' +
      '</div>' +
      '<p class="sub">Sequência: <strong>' + plural(r.sequencia, 'dia', 'dias') + '</strong> · XP total: <strong>' + estado.xp + '</strong></p>' +
      (novas ? '<div class="novas">' + novas + '</div>' : '') +
      '<div class="acoes-fim">' +
        (proxima ? '<button type="button" class="btn btn-primario btn-cheio" data-acao="proxima">Próxima lição</button>' : '') +
        '<button type="button" class="btn btn-cheio" data-acao="voltar">' + (proxima ? 'Voltar à trilha' : 'Concluir e voltar à trilha') + '</button>' +
        '<button type="button" class="btn btn-link" data-acao="refazer">' + icone('redo') + ' Refazer esta lição</button>' +
      '</div>' +
    '</main>';
  /* confete leve (some sozinho; fica parado se a pessoa pediu menos movimento) */
  const caixa = $('.confete', app);
  const cores = ['#F5A524', '#0F766E', '#E8590C', '#7C5CE0', '#D6336C'];
  for (let k = 0; k < 28; k++) {
    const p = document.createElement('i');
    p.style.background = cores[k % cores.length];
    p.style.setProperty('--dx', Math.round((Math.random() - 0.5) * 360) + 'px');
    p.style.setProperty('--dy', Math.round(120 + Math.random() * 260) + 'px');
    p.style.setProperty('--rot', Math.round((Math.random() - 0.5) * 720) + 'deg');
    p.style.animationDelay = Math.round(Math.random() * 250) + 'ms';
    caixa.appendChild(p);
  }
  setTimeout(function () { if (caixa.isConnected) caixa.remove(); }, 2400);
}

/* ---------- botões das telas ---------- */
ACOES.abrir = function (el) {
  const l = licaoPorId(el.dataset.id), i = TODAS_LICOES.indexOf(l);
  if (!licaoLiberada(i)) { aviso('Conclua a lição anterior para liberar esta.'); return; }
  ui.licaoId = l.id;
  irPara('inicio');
};
ACOES.comecar = function () { Licao.iniciar(licaoPorId(ui.licaoId)); };
ACOES.voltar = function () { irPara('trilha'); };
ACOES.refazer = function () { Licao.iniciar(ui.fim.licao); };
ACOES.proxima = function () {
  const i = TODAS_LICOES.indexOf(ui.fim.licao), p = TODAS_LICOES[i + 1];
  if (p) { ui.licaoId = p.id; irPara('inicio'); } else irPara('trilha');
};
ACOES.reiniciar = function () {
  abrirModal({
    titulo: 'Reiniciar progresso?',
    html: '<p>Isso apaga seu XP, sua sequência, as lições concluídas e as conquistas <strong>deste navegador</strong>. Não dá para desfazer.</p>',
    botoes: [
      { rotulo: 'Cancelar', classe: 'btn-primario' },
      { rotulo: 'Apagar tudo e reiniciar', classe: 'btn-ruim', acao: function () { reiniciarProgresso(); irPara('trilha'); aviso('Progresso reiniciado.'); } }
    ]
  });
};

/* =====================================================================
   8. INÍCIO: desenha a primeira tela
   ===================================================================== */
document.title = APP.nome + ' — aprenda Python passo a passo';
/* confere as lições antes de abrir; se houver erro de digitação no conteúdo, mostra a lista em vez de quebrar */
const PROBLEMAS_CURSO = validarCurso();
if (PROBLEMAS_CURSO.length) mostrarProblemas(PROBLEMAS_CURSO); else render(true);

</script>
